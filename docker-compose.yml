version: '3.8'

services:
  frontend:
    container_name: ocbc-mobile-pro
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

# Usage:
# Build: docker-compose build
# Run: docker-compose up -d
# Stop: docker-compose down
# Logs: docker logs ocbc-mobile-pro
#
# Access: http://localhost:8080
# Connect to host Appium: http://host.docker.internal:4723
